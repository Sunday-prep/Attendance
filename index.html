:root{--bg:#fff7ec;--card:#fff;--tx:#2d2a4a;--mut:#7b7794;--pri:#e0457b;--gold:#ffb703;--ol:#22b573;--bd:#f1e3d3;--red:#e63946;--h1:#ffe2ec;--h2:#fff1c9;--h3:#d8f5e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a2e;--card:#26254a;--tx:#f5f1ff;--mut:#aaa6c8;--pri:#ff7aa8;--ol:#4cd9a0;--bd:#3a3868;--red:#ff6b7a;--h1:#3a2450;--h2:#3a3358;--h3:#1f4a4a}}
:root[data-theme="dark"]{--bg:#1b1a2e;--card:#26254a;--tx:#f5f1ff;--mut:#aaa6c8;--pri:#ff7aa8;--ol:#4cd9a0;--bd:#3a3868;--red:#ff6b7a;--h1:#3a2450;--h2:#3a3358;--h3:#1f4a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
header{text-align:center;padding:14px 12px 12px;background:linear-gradient(135deg,var(--h1),var(--h2) 50%,var(--h3));border-radius:0 0 28px 28px}header img{width:110px;height:auto;border-radius:18px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:900px;margin:auto}
nav button{flex:1;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
nav .bd{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-inline-start:4px}
main{max-width:900px;margin:auto;padding:8px 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;color:var(--pri);font-size:19px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;min-width:0}
button.b{font:inherit;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;background:var(--pri);color:#fff}
button.g{background:var(--ol)}button.d{background:transparent;color:var(--red);border:1px solid var(--red)}button.l{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.fam{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.fam span{flex:1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:middle}th{color:var(--mut);font-weight:600}
td input[type=text],td input[type=tel],td select{width:100%;min-width:110px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
.weak{color:var(--red);font-weight:700}.mut{color:var(--mut);font-size:13px}.ok{color:var(--ol)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;color:var(--mut);font-size:18px;flex:none}
.lk{cursor:pointer;color:var(--pri);font-weight:600;text-decoration:underline}.big{width:150px;height:150px;font-size:64px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 14px;text-align:center;font-size:13px}.chip b{display:block;font-size:20px;color:var(--pri)}
nav button{border-width:2px;border-color:var(--a,var(--bd));font-weight:600}
nav button.on{background:var(--a,var(--pri));color:#fff;border-color:var(--a,var(--pri))}
.t-att{--a:#22b573}.t-kids{--a:#3a9be8}.t-vis{--a:#ff8a3d}.t-fam{--a:#9b5de5}.t-notif{--a:#e0457b}.t-rep{--a:#16a8a0}.t-pw{--a:#6c7a89}
.ac-att{--ac:#22b573}.ac-kids{--ac:#3a9be8}.ac-vis{--ac:#ff8a3d}.ac-fam{--ac:#9b5de5}.ac-notif{--ac:#e0457b}.ac-rep{--ac:#16a8a0}.ac-pw{--ac:#6c7a89}
main .card{border-top:4px solid var(--ac,var(--pri));box-shadow:0 2px 8px rgba(0,0,0,.05)}main h2{color:var(--ac,var(--pri))}
main button.b{background:var(--ac,var(--pri))}main button.b.g{background:var(--ol)}main button.b.l{background:var(--card);color:var(--tx)}main button.b.d{background:transparent;color:var(--red)}
.chip b,.lk{color:var(--ac,var(--pri))}input[type=checkbox]{accent-color:var(--ac,var(--pri))}
.note{border-inline-start:4px solid var(--gold);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:6px}

<div id="sy" class="mut" style="text-align:center;font-size:12px;min-height:18px"></div><nav id="nav"></nav><main id="m"></main>
<script>
async function getDL(){if(window.claude&&claude.use){try{return await claude.use('downloads')}catch(e){}}return{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}}}
const KEY='sunday-service-v1';let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.kids)S={families:['يوسف الصديق','الانبا موسى','مارمينا'],kids:[],att:{},notes:{}};
S.visits=S.visits||[];S.dis=S.dis||{};S.read=S.read||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEAK='حضور ضعيف – محتاج متابعة';
let q={kids:'',att:'',vis:''},prof=null,tab='att',editF=-1,delF=-1,delK=null,date=new Date().toISOString().slice(0,10),famFilter='',msg='';
const dates=()=>Object.keys(S.att).sort();
function stats(k){const ds=dates(),t=ds.length,p=ds.filter(d=>S.att[d][k.id]).length,pct=t?Math.round(p/t*100):null;
 const last2=t>=2&&!S.att[ds[t-1]][k.id]&&!S.att[ds[t-2]][k.id];
 return{t,p,pct,weak:t>=2&&(last2||pct<50)}}
const flag=k=>stats(k).weak?`<div class="weak">${WEAK}</div>`:'';
const famOpts=sel=>`<option value="">—</option>`+S.families.map(f=>`<option ${f===sel?'selected':''}>${esc(f)}</option>`).join('');
const nid=()=>Date.now()+Math.floor(Math.random()*1000);
function notifCount(){return nItems().filter(i=>!S.read.includes(i.key)).length}
function render(){lo.style.display=authed?'block':'none';if(authed===null){nav.innerHTML='';m.className='ac-kids';m.innerHTML='<div class="mut" style="text-align:center;padding:40px">جاري التحميل…</div>';return}if(!authed){nav.innerHTML='';m.className='ac-kids';m.innerHTML=vLogin();return}
 const T=[['att','تسجيل الحضور'],['kids','كشوفات الأولاد'],['vis','الافتقاد'],['fam','الأسر'],['notif','الإشعارات']],c=notifCount();
 nav.innerHTML=T.map(([k,v])=>`<button class="t-${k} ${tab===k?'on':''}" onclick="tab='${k}';prof=null;render()">${v}${k==='notif'&&c?`<span class="bd">${c}</span>`:''}</button>`).join('');
 m.className=prof?'ac-kids':'ac-'+tab;m.innerHTML=prof?vProf():({att:vAtt,kids:vKids,vis:vVis,fam:vFam,notif:vNotif})[tab]();
}
const av=(k,ed)=>{const i=k.photo?`<img class="av" src="${k.photo}" alt="">`:`<span class="av">👤</span>`;return ed?`<label title="إضافة / تغيير الصورة" style="cursor:pointer">${i}<input type="file" accept="image/*" hidden onchange="upPh(${k.id},this)"></label>`:i};
function upPh(id,inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=160,r=Math.min(im.width,im.height);c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-r)/2,(im.height-r)/2,r,r,0,0,s,s);S.kids.find(k=>k.id===id).photo=c.toDataURL('image/jpeg',0.8);save();render()};im.src=rd.result};rd.readAsDataURL(f)}
function rmPh(id){delete S.kids.find(k=>k.id===id).photo;save();render()}
const phBtn=k=>`<label class="b l" style="cursor:pointer;font-size:12px;padding:3px 8px;border:1px solid var(--bd);border-radius:8px;display:inline-block">📷 ${k.photo?'تغيير':'رفع'} صورة<input type="file" accept="image/*" hidden onchange="upPh(${k.id},this)"></label>${k.photo?` <button class="b d" style="padding:0 6px;font-size:12px" onclick="rmPh(${k.id})">إزالة</button>`:''}`;
const TYPES=['تليفون','زيارة','شات','خدمة فردية'];
const vc=k=>S.visits.filter(v=>v.kid===k.id).length;
const nm=k=>`<span class="lk" onclick="openP(${k.id})">${esc(k.name)}</span>`;
function openP(id){prof=id;window.scrollTo(0,0);render()}
let vf={type:'تليفون',date:new Date().toISOString().slice(0,10),note:''},delV=null,editV=null;
function visForm(fixed){return `<div class="row">${fixed?'':`<select id="vk"><option value="">اختار الولد</option>${S.kids.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select>`}<input type="date" id="vd" value="${vf.date}"><select id="vt">${TYPES.map(t=>`<option ${t===vf.type?'selected':''}>${t}</option>`).join('')}</select><input id="vn" placeholder="ملاحظات" value="${esc(vf.note)}" style="flex:1;min-width:140px"><label class="row" style="gap:4px"><input type="checkbox" id="vnn"> أظهر في الإشعارات</label><button class="b" onclick="addV(${fixed||0})">تسجيل</button></div>`}
function addV(f){const kid=f||+(document.getElementById('vk')||{}).value;if(!kid||!vd.value)return;S.visits.push({id:nid(),kid,date:vd.value,type:vt.value,note:vn.value.trim(),n:vnn.checked});vf.date=vd.value;vf.type=vt.value;save();render()}
function rmV(id){S.visits=S.visits.filter(v=>v.id!==id);delV=null;save();render()}
const delBtn=id=>`<button class="b l" onclick="editV=${id};delV=null;render()">تعديل</button> `+(delV===id?`<button class="b d" onclick="rmV(${id})">تأكيد؟</button>`:`<button class="b d" onclick="delV=${id};render()">حذف</button>`);
function vVis(){const vs=[...S.visits].filter(v=>{const k=S.kids.find(x=>x.id===v.kid);return k&&mt(k)}).sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="card"><h2>تسجيل الافتقاد</h2>${visForm(0)}</div><div class="card"><div class="chips">${TYPES.map(t=>`<div class="chip"><b>${S.visits.filter(v=>v.type===t).length}</b>${t}</div>`).join('')}<div class="chip"><b>${S.visits.length}</b>الإجمالي</div></div></div><div class="card tw">${sbox()}<table><tr><th>التاريخ</th><th>الولد</th><th>النوع</th><th>ملاحظات</th><th></th></tr>`+(vs.map(v=>{const k=S.kids.find(x=>x.id===v.kid);return k?(editV===v.id?`<tr><td colspan="5">${vEdit(v)}</td></tr>`:`<tr><td>${v.date}</td><td><div class="row" style="flex-wrap:nowrap">${av(k)}${nm(k)}</div></td><td>${v.type}</td><td>${esc(v.note)}${v.n?' 🔔':''}</td><td>${delBtn(v.id)}</td></tr>`):''}).join('')||`<tr><td colspan="5" class="mut">لا يوجد افتقاد مسجل</td></tr>`)+`</table></div>`+repBox('v')}
function vProf(){const k=S.kids.find(x=>x.id===prof);if(!k){prof=null;return''}const s=stats(k),vs=S.visits.filter(v=>v.kid===k.id).sort((a,b)=>b.date.localeCompare(a.date));
 return `<button class="b l" onclick="prof=null;render()">→ رجوع</button><div class="card" style="margin-top:10px;text-align:center">${av(k).replace('class="av"','class="av big"')}<div style="margin:8px 0">${phBtn(k)}</div><h2 style="font-size:24px;margin:4px 0">${esc(k.name)}</h2><div class="mut">${esc(k.family)||'بدون أسرة'}${k.phone?' · '+esc(k.phone):''}</div>${flag(k)}<div class="chips" style="justify-content:center;margin-top:12px"><div class="chip"><b>${s.pct===null?'—':s.pct+'%'}</b>نسبة الحضور</div><div class="chip"><b>${s.p}/${s.t}</b>مرات الحضور</div><div class="chip"><b>${vs.length}</b>مرات الافتقاد</div></div></div><div class="card"><h2>تسجيل افتقاد</h2>${visForm(k.id)}</div><div class="card"><h2>سجل الافتقاد</h2>${vs.map(v=>editV===v.id?`<div class="note">${vEdit(v)}</div>`:`<div class="note row sp"><span><b>${v.date}</b> · ${v.type}${v.note?' — '+esc(v.note):''}${v.n?' 🔔':''}</span>${delBtn(v.id)}</div>`).join('')||'<div class="mut">لا يوجد افتقاد مسجل</div>'}</div><div class="card"><h2>سجل الحضور</h2><div class="chips">${dates().reverse().map(d=>`<div class="chip"><b style="color:var(--${S.att[d][k.id]?'ol':'red'})">${S.att[d][k.id]?'✓':'✗'}</b>${d}</div>`).join('')||'<div class="mut">لا توجد أيام مسجلة</div>'}</div></div>`}
const norm=s=>String(s||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u0652]/g,'').toLowerCase();
const mt=k=>norm(k.name).includes(norm((q[tab]||'').trim()));
const sbox=()=>`<div class="row" style="margin-bottom:10px"><input id="sq" type="search" style="flex:1" placeholder="🔍 بحث باسم الولد" value="${esc(q[tab])}" onkeydown="if(event.key==='Enter')doQ()"><button class="b" onclick="doQ()">بحث</button>${q[tab]?`<button class="b l" onclick="q[tab]='';render()">مسح</button>`:''}</div>`;

function vEdit(v){return `<div class="row"><input type="date" id="eVd" value="${v.date}"><select id="eVt">${TYPES.map(t=>`<option ${t===v.type?'selected':''}>${t}</option>`).join('')}</select><input id="eVn" placeholder="ملاحظات" value="${esc(v.note)}" style="flex:1;min-width:140px"><label class="row" style="gap:4px"><input type="checkbox" id="eVc" ${v.n?'checked':''}> أظهر في الإشعارات</label><button class="b g" onclick="saveV(${v.id})">حفظ</button><button class="b l" onclick="editV=null;render()">إلغاء</button></div>`}
function saveV(id){const v=S.visits.find(x=>x.id===id);v.date=eVd.value||v.date;v.type=eVt.value;v.note=eVn.value.trim();v.n=eVc.checked;editV=null;save();render()}

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let authed=null,lastC='',lastK={},tm=null,subs=[],firstK=true;
const status=t=>{const e=document.getElementById('sy');if(e)e.textContent=t};
const cfgOf=()=>({families:S.families,att:S.att,notes:S.notes,visits:S.visits,dis:S.dis,read:S.read});
const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function push(){if(!authed)return;clearTimeout(tm);status('جاري الحفظ…');tm=setTimeout(async()=>{try{
 const c=JSON.stringify(cfgOf());if(c!==lastC){lastC=c;await db.doc('sunday/cfg').set(JSON.parse(c))}
 const cur={};S.kids.forEach(k=>cur[k.id]=JSON.stringify(k));
 for(const id in cur)if(lastK[id]!==cur[id]){lastK[id]=cur[id];await db.doc('kids/'+id).set(JSON.parse(cur[id]))}
 for(const id in lastK)if(!(id in cur)){delete lastK[id];await db.doc('kids/'+id).delete()}
 status('✓ تم الحفظ على السيرفر')}catch(e){lastC='';lastK={};status('⚠ تعذر الحفظ – اتأكد من الإنترنت')}},400)}
function startSync(){stopSync();firstK=true;
 subs.push(db.doc('sunday/cfg').onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;if(!s.exists){push();return}const d=s.data();S.families=d.families||[];S.att=d.att||{};S.notes=d.notes||{};S.visits=d.visits||[];S.dis=d.dis||{};S.read=d.read||[];lastC=JSON.stringify(cfgOf());cache();render();status('✓ متزامن')},()=>status('⚠ تعذر الاتصال بالسيرفر')));
 subs.push(db.collection('kids').onSnapshot(q=>{if(q.metadata.hasPendingWrites)return;if(firstK&&q.empty){firstK=false;push();return}firstK=false;S.kids=q.docs.map(d=>d.data()).sort((x,y)=>x.id-y.id);lastK={};S.kids.forEach(k=>lastK[k.id]=JSON.stringify(k));cache();render()},()=>status('⚠ تعذر الاتصال بالسيرفر')))}
function stopSync(){subs.forEach(f=>f());subs=[]}
auth.onAuthStateChanged(u=>{authed=!!u;if(u)startSync();else{stopSync();status('')}render()});
const em=u=>u.includes('@')?u:u.toLowerCase()+'@sunday-service.app';
function vLogin(){return `<div class="card" style="max-width:380px;margin:24px auto;text-align:center"><h2>تسجيل الدخول</h2><div style="display:grid;gap:10px"><input id="lu" placeholder="اسم المستخدم أو الإيميل" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"><input id="lp" type="password" placeholder="كلمة السر" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><label class="row" style="gap:6px;justify-content:center;font-size:14px"><input type="checkbox" onchange="lp.type=this.checked?'text':'password'"> إظهار كلمة السر</label><button class="b" onclick="doLogin()">دخول</button><div id="le" class="weak"></div></div></div>`}
async function doLogin(){const u=lu.value.trim(),p=lp.value;if(!u||!p){le.textContent='اكتب اسم المستخدم وكلمة السر';return}le.textContent='';
 try{await auth.signInWithEmailAndPassword(em(u),p)}catch(e){const c=e.code||'';le.textContent=c.includes('too-many')?'محاولات كتير، جرّب بعد شوية':c.includes('network')?'تأكد من الاتصال بالإنترنت':'اسم المستخدم أو كلمة السر غلط'}}
function logout(){prof=null;try{localStorage.removeItem(KEY)}catch(e){}auth.signOut()}
/* الأسر */
function vFam(){return `<div class="card"><h2>الأسر</h2><div class="row"><input id="nf" placeholder="اسم الأسرة الجديدة" onkeydown="if(event.key==='Enter')addF()"><button class="b" onclick="addF()">إضافة</button></div>`+
 S.families.map((f,i)=>`<div class="fam">${editF===i?`<input id="ef" value="${esc(f)}" style="flex:1"><button class="b g" onclick="saveF(${i})">حفظ</button><button class="b l" onclick="editF=-1;render()">إلغاء</button>`:
 `<span>${esc(f)} <small class="mut">(${S.kids.filter(k=>k.family===f).length} ولد)</small></span><button class="b l" onclick="editF=${i};delF=-1;render()">تعديل</button>`+
 (delF===i?`<button class="b d" onclick="delFam(${i})">تأكيد الحذف؟</button>`:`<button class="b d" onclick="delF=${i};render()">حذف</button>`)}</div>`).join('')+`</div>`+bkBox()}
let bkP=null;
function bkBox(){return `<div class="card"><h2>نسخة احتياطية</h2><div class="row"><button class="b g" onclick="bkExp()">⬇ تنزيل نسخة احتياطية (JSON)</button><label class="b l" style="cursor:pointer;border:1px solid var(--bd);border-radius:8px;padding:7px 14px">رفع نسخة احتياطية<input type="file" accept=".json" hidden onchange="bkImp(this)"></label></div>${bkP?`<div class="weak" style="margin-top:8px">الملف فيه ${bkP.kids.length} ولد، والاستعادة هتستبدل كل البيانات الحالية.</div><div class="row" style="margin-top:6px"><button class="b d" onclick="bkOk()">تأكيد الاستعادة</button><button class="b l" onclick="bkP=null;render()">إلغاء</button></div>`:'<div class="mut" style="margin-top:6px">فيها الأولاد والأسر والحضور والافتقاد والصور.</div>'}</div>`}
async function bkExp(){const dl=await getDL();try{await dl.save({filename:'backup-'+new Date().toISOString().slice(0,10)+'.json',data:JSON.stringify(S)})}catch(e){}}
async function bkImp(i){const f=i.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.kids))throw 0;bkP=o}catch(e){bkP=null}render()}
function bkOk(){S=Object.assign({families:[],kids:[],att:{},notes:{},visits:[],dis:{},read:[]},bkP);bkP=null;save();render()}
function addF(){const v=nf.value.trim();if(v&&!S.families.includes(v)){S.families.push(v);save()}render()}
function saveF(i){const v=ef.value.trim(),o=S.families[i];if(v&&(v===o||!S.families.includes(v))){S.families[i]=v;S.kids.forEach(k=>{if(k.family===o)k.family=v})}editF=-1;save();render()}
function delFam(i){const o=S.families[i];S.kids.forEach(k=>{if(k.family===o)k.family=''});S.families.splice(i,1);delF=-1;save();render()}
/* كشوفات الأولاد */
function vKids(){return `<div class="card"><h2>كشوفات الأولاد</h2>
 <div class="row"><input id="kn" placeholder="اسم الولد"><input id="kp" type="tel" placeholder="رقم التليفون" style="max-width:150px"><select id="kf">${famOpts('')}</select><button class="b" onclick="addK()">إضافة</button></div>
 <div class="row" style="margin-top:10px"><button class="b g" onclick="dlXlsx(false)">تنزيل Template فاضي</button><button class="b g" onclick="dlXlsx(true)">تنزيل البيانات الحالية</button><label class="b l" style="cursor:pointer;border:1px solid var(--bd);border-radius:8px;padding:7px 14px">رفع ملف Excel<input type="file" accept=".xlsx,.xls" hidden onchange="upX(this)"></label></div>
 <div class="mut" style="margin-top:6px">${esc(msg)}</div></div>
 <div class="card tw">${sbox()}<table><tr><th>مسلسل</th><th>الصورة</th><th>اسم الولد</th><th>التليفون</th><th>الأسرة</th><th>الحضور</th><th></th></tr>`+
 (S.kids.map((k,i)=>{if(!mt(k))return'';const s=stats(k);return `<tr><td>${i+1}</td><td>${av(k)}<br>${phBtn(k)}</td><td><input type="text" value="${esc(k.name)}" onchange="upK(${k.id},'name',this.value)"></td><td><input type="tel" value="${esc(k.phone)}" onchange="upK(${k.id},'phone',this.value)"></td><td><select onchange="upK(${k.id},'family',this.value)">${famOpts(k.family)}</select></td><td>${s.pct===null?'—':s.pct+'% ('+s.p+'/'+s.t+')'}${flag(k)}</td><td><button class="b g" onclick="openP(${k.id})">الحساب</button> ${delK===k.id?`<button class="b d" onclick="delKid(${k.id})">تأكيد؟</button>`:`<button class="b d" onclick="delK=${k.id};render()">حذف</button>`}</td></tr>`}).join('')||`<tr><td colspan="7" class="mut">لا يوجد أولاد بعد</td></tr>`)+`</table></div>`}
function addK(){const n=kn.value.trim();if(!n)return;S.kids.push({id:nid(),name:n,phone:kp.value.trim(),family:kf.value});save();render()}
function upK(id,f,v){const k=S.kids.find(x=>x.id===id);k[f]=v.trim?v.trim():v;save();render()}
function delKid(id){S.kids=S.kids.filter(k=>k.id!==id);S.visits=S.visits.filter(v=>v.kid!==id);for(const d in S.att)delete S.att[d][id];delK=null;save();render()}
async function dlXlsx(withData){
 const dl=await getDL();if(!dl){msg='التنزيل غير متاح هنا';return render()}
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('كشوفات الأولاد',{views:[{rightToLeft:true}]}),ls=wb.addWorksheet('الأسر',{state:'hidden'});
 S.families.forEach((f,i)=>ls.getCell(i+1,1).value=f);
 ws.columns=[{header:'مسلسل',width:9},{header:'اسم الولد',width:30},{header:'رقم التليفون',width:18}].concat(withData?[{header:'الحضور',width:16}]:[]).concat([{header:'اسم الاسرة',width:22}]);const fc=withData?5:4;
 ws.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF6B1F3E'}};c.alignment={horizontal:'center'}});
 if(withData)S.kids.forEach((k,i)=>{const s=stats(k);ws.addRow([i+1,k.name,k.phone,s.pct===null?'':s.pct+'%',k.family])});
 const n=Math.max(S.families.length,1);
 for(let r=2;r<=500;r++){ws.getCell(r,3).numFmt='@';ws.getCell(r,fc).dataValidation={type:'list',allowBlank:true,formulae:["'الأسر'!$A$1:$A$"+n]}}
 try{await dl.save({filename:withData?'كشوفات-الأولاد.xlsx':'template-كشوفات-الأولاد.xlsx',data:await wb.xlsx.writeBuffer()})}catch(e){}
}
async function upX(inp){const f=inp.files[0];if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let a=0;
  rows.forEach(r=>{const n=String(r['اسم الولد']||'').trim();if(!n)return;const p=String(r['رقم التليفون']||'').trim(),fm=String(r['اسم الاسرة']||'').trim();
   if(fm&&!S.families.includes(fm))S.families.push(fm);
   const ex=S.kids.find(k=>k.name===n);if(ex){ex.phone=p||ex.phone;ex.family=fm||ex.family}else{S.kids.push({id:nid(),name:n,phone:p,family:fm});a++}});
  msg=`تم رفع الملف: ${a} ولد جديد`;save()}catch(e){msg='تعذر قراءة الملف'}render()}
/* الحضور */
function vAtt(){const ds=S.att[date],ks=S.kids.filter(k=>(!famFilter||k.family===famFilter)&&mt(k));
 return `<div class="card"><h2>تسجيل الحضور</h2><div class="row"><input type="date" value="${date}" onchange="date=this.value;render()"><select onchange="famFilter=this.value;render()"><option value="">كل الأسر</option>${S.families.map(f=>`<option ${f===famFilter?'selected':''}>${esc(f)}</option>`).join('')}</select>
 ${ds?`<span class="ok">✓ اليوم مسجل (${Object.keys(ds).filter(k=>ds[k]).length} حاضر)</span><button class="b d" onclick="if(delD)rmDay();else{delD=1;render()}">${delD?'تأكيد حذف اليوم؟':'حذف اليوم'}</button>`:`<button class="b g" onclick="S.att[date]={};save();render()">بدء تسجيل اليوم</button>`}</div></div>
 <div class="card tw">${sbox()}<table><tr><th>الاسم</th><th>الأسرة</th><th>حضر</th><th>ملاحظات</th><th>إظهار في الإشعارات</th></tr>`+
 (ks.map(k=>{const n=(S.notes[date]||{})[k.id]||{t:'',n:false};return `<tr><td><div class="row" style="flex-wrap:nowrap">${av(k)}<div>${nm(k)}${flag(k)}</div></div></td><td>${esc(k.family)}</td><td><input type="checkbox" ${ds&&ds[k.id]?'checked':''} onchange="setP(${k.id},this.checked)"></td><td><input type="text" value="${esc(n.t)}" placeholder="ملاحظات" onchange="setN(${k.id},this.value,null)"></td><td><input type="checkbox" ${n.n?'checked':''} onchange="setN(${k.id},null,this.checked)"></td></tr>`}).join('')||`<tr><td colspan="5" class="mut">أضف الأولاد من تبويب كشوفات الأولاد</td></tr>`)+`</table></div>`+repBox('a')}
let delD=0;
function setP(id,v){S.att[date]=S.att[date]||{};S.att[date][id]=v;save();render()}
function setN(id,t,n){S.notes[date]=S.notes[date]||{};const o=S.notes[date][id]||{t:'',n:false};if(t!==null)o.t=t;if(n!==null)o.n=n;S.notes[date][id]=o;save();render()}
function rmDay(){delete S.att[date];delD=0;save();render()}
/* الإشعارات */
function nItems(){const it=[],sg=dates().length;
 S.kids.forEach(k=>{if(stats(k).weak&&S.dis[k.id]!==sg)it.push({key:'w:'+k.id+':'+sg,t:'w',k})});
 for(const d of Object.keys(S.notes).sort().reverse())for(const id in S.notes[d]){const o=S.notes[d][id],k=S.kids.find(x=>x.id==id);if(o.n&&k)it.push({key:'a:'+d+':'+id,t:'a',k,d,txt:o.t,ref:o})}
 [...S.visits].sort((a,b)=>b.date.localeCompare(a.date)).forEach(v=>{const k=S.kids.find(x=>x.id===v.kid);if(v.n&&k)it.push({key:'v:'+v.id,t:'v',k,d:v.date,txt:v.note,ref:v,type:v.type})});
 return it}
function clearN(){nItems().forEach(i=>{if(!S.read.includes(i.key))S.read.push(i.key)});save();render()}
function delN(key){const i=nItems().find(x=>x.key===key);if(!i)return;if(i.t==='w')S.dis[i.k.id]=dates().length;else i.ref.n=false;save();render()}
function vNotif(){const it=nItems();
 const row=i=>{const nw=!S.read.includes(i.key),s=stats(i.k);
  const body=i.t==='w'?`<div class="weak">${WEAK}</div><small class="mut">${esc(i.k.family)} · ${esc(i.k.phone)} · ${s.pct}% (${s.p}/${s.t}) · افتقاد: ${vc(i.k)}</small>`:`<small class="mut">${esc(i.k.family)} · ${i.d} · ${i.t==='v'?'افتقاد ('+esc(i.type)+')':'حضور'}</small><div>${esc(i.txt)||'—'}</div>`;
  return `<div class="note row sp" style="flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">${av(i.k)}<div><b>${nm(i.k)}</b>${nw?' <span style="background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px">جديد</span>':''}<br>${body}</div></div><button class="b d" onclick="delN('${i.key}')">حذف</button></div>`};
 return `<div class="card"><div class="row sp"><h2 style="margin:0">الإشعارات</h2><button class="b g" onclick="clearN()">تصفير العداد (تعليم الكل كمقروء)</button></div></div><div class="card">`+(it.map(row).join('')||'<div class="mut">لا توجد إشعارات</div>')+`</div>`}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
